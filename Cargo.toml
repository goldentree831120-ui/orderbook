[package]
name = "orderbook"
version = "0.1.0"
edition = "2021"
description = "A price-time priority limit order book (M1: core engine, no I/O)"
license = "MIT"

[dependencies]
# M1 intentionally has zero dependencies: std only.

[profile.release]
debug = true   # keep symbols for profiling in M3

[dev-dependencies]
criterion = "0.5"
proptest = "1"

[[bench]]
name = "engine"
harness = false

# The property tests run hundreds of thousands of operations. Unoptimised (the default
# for `cargo test`) heavy_cancels_on_one_level took ~150 s on a laptop; optimised, seconds.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2   # proptest/criterion themselves
